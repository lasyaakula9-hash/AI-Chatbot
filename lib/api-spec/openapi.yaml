openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chatbot
    description: AI chat operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /gemini/chat:
    post:
      operationId: streamChatResponse
      tags: [chatbot]
      summary: Stream an AI response for a chat history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: Server-sent event stream of assistant response chunks
          content:
            text/event-stream: {}
        "400":
          description: Invalid chat input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChatMessageInput:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 12000
      required:
        - role
        - content
    ChatInput:
      type: object
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/ChatMessageInput"
      required:
        - messages
    ChatError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

